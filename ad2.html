<script>
    function detectFakeOffer() {
    const offerText = document.getElementById('offerText').value;

    // Check for common patterns or keywords associated with fake offers
    const patterns = [
        /free\s*\w*\s*[\w\s]*/i,       // e.g., "free gift", "get free"
        /win\s*\w*\s*[\w\s]*/i,        // e.g., "win a prize", "chance to win"
        /limited\s*offer/i,            // e.g., "limited time offer"
        /exclusive\s*deal/i,           // e.g., "exclusive offer"
        /guaranteed\s*win/i,           // e.g., "guaranteed to win"
        /discount\s*\d+%/i,            // e.g., "discount 50%"
        /save\s*\d+\s*\w*/i,           // e.g., "save $100"
        /act\s*now/i,                  // e.g., "act now!"
        /urgent\s*offer/i             // e.g., "urgent offer"
    ];

    let isFakeOffer = false;

    // Check if any pattern matches the offer text
    patterns.forEach(pattern => {
        if (pattern.test(offerText)) {
            isFakeOffer = true;
        }
    });

    // Display result
    const offerResult = document.getElementById('offerResult');
    if (isFakeOffer) {
        offerResult.innerHTML = "<p class='fake'>This offer appears to be fake.</p>";
    } else {
        offerResult.innerHTML = "<p class='legitimate'>This offer seems to be legitimate.</p>";
    }
}
