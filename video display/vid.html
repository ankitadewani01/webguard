        <div class="video-container">

            <video src="videos/v1.mp4" muted autoplay controls></video>
        </div>
    </div>
    <script>
        document.querySelectorAll('.video-container .video').forEach(vid => {
            vid.onclick = () => {
                document.querySelector('.popup-video').style.display = 'block';
                document.querySelector('.popup-video video').src = vid.querySelector('video').getAttribute('src');
            }
        });
        
        document.querySelector('.popup-video span').onclick = () => {
            document.querySelector('.popup-video').style.display = 'none';
        }
        let b = document.querySelector(".mode");
            let cur="light"
            b.addEventListener("click",(evt)=>{
                if(cur==="light"){
                    cur="dark";
                    document.body.style.background= "rgb(2, 2, 33)";
                    document.body.style.color="burlywood";
                }
                else{
                    cur="light";
                    document.body.style.background= "rgba(219, 235, 241, 0.6)";
                    document.body.style.color="black";
                }
            })
    </script>
