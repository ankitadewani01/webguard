<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="chatbot.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0">
    <script src="chatbot.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <div class="nav-bar" >
            <h1 class="heading-nav">WEBGAURD</h1>
        </div>
        <div class="nav-barr">
            <h1>CHATBOT</h1>
        </div>
    </header>
    <div class="chatbot">
        <header>
            <h2>Chatbot</h2>
        </header>
        <ul class="chatbox">
            <li class="chat incoming">
                <span class="material-symbols-outlined"></span>
                <p>Hi there <br>How can I help you?</p>
            </li>
           
        </ul>
        <div class="chat-input">
            <textarea placeholder="Enter a message..." required></textarea>
            <span id="send-btn" class="material-symbols-outlined">send</span>
        </div>
    </div>
    <script>
        let b = document.querySelector(".mode");
                let cur="light"
                b.addEventListener("click",(evt)=>{
                    if(cur==="light"){
                        cur="dark";
                        document.body.style.background= "rgb(2, 2, 33)";
                        document.body.style.color="burlywood";
                    }
                    else{
                        cur="light";
                        document.body.style.background= "rgba(219, 235, 241, 0.6)";
                        document.body.style.color="black";
                    }
                })
    </script>
</body>
</html>
